[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "x2-demo"
version = "0.1.0.dev0"
description = "X2 offline planning primitives and regression baseline; no robot runtime"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
